# TB3.0 task manifest.
#
artifacts = ["/app/sluice/intake_server.py"]
name = "redact-cluster-support-bundle"

[metadata]
author_name = "Danny Huston"
author_email = "huston.danny@gmail.com"

# category must be one of: Science, Software, ML, Operations, Security, Hardware, Media
# subcategory is an open list — see the taxonomy for the conventional values.
category = "Security"
subcategory = "AppSec"
tags = ["kubernetes", "redaction", "data-exposure", "http-server", "openshift"]
languages = ["python", "shell"]
expert_time_estimate_hours = 6
# One of: base, core, advanced, frontier — set from measured pass rates, not by feel.
difficulty = "advanced"

difficulty_explanation = """
The service has to reproduce what a release desk does by hand, and the rules are not written
down: the agent gets three collected bundles, the summaries the desk cleared for them, and the
estate's ranges, DNS suffixes and env-var hints in the service config. It has to work out from
that evidence which strings identify the estate and which ones the vendor's engineers cannot work
without, when both sit in the same log line. A mirrored image keeps its digest and loses its
registry host; an upstream image is untouched. A node's address is replaced even when it sits
outside every configured range, while a libvirt bridge address and the metadata address beside it
stay. A sibling node the bundle never lists is replaced because it follows the node naming
pattern. A container env value is replaced when its variable name marks a credential, unless the
value is only a path. An address is the same address written plainly, with a port, as the network
or either end of a range, or reversed inside a PTR query, and takes one placeholder in all of
them; a hostname is the same hostname in upper case. File contents logged as data URLs have to be
decoded, through gzip and through payloads nested inside payloads, cleaned with the same
placeholders as the surrounding text and re-encoded as they arrived, while clean or binary
payloads come back byte for byte. None of that is visible without diffing the samples against
their cleared summaries and decoding what is inside them, and the held-out bundles combine the
rules in ways the samples do not: an address form applied to a node address outside the ranges, a
payload nested under a gzipped one, a credential inside a nested payload. The output must also be
byte-identical across processes and key orders, which rules out the shipped hash()-based helper
and a re-compressed gzip stream that carries the current time.
"""

solution_explanation = """
The oracle rewrites /app/sluice/intake_server.py to return only items, events and log_excerpts,
one entry per bundle entry in bundle order, copying the identifying fields verbatim and passing
name, node, message and line through a per-request redactor. The redactor builds an inventory of
declared values from submitted_by, bundle_id, the cluster block, each node's name, short name and
mac, and every env value whose variable name matches the configured hints unless the value is an
absolute path. It applies that inventory plus pattern rules for hostnames under the configured
suffixes (matched and keyed case-insensitively), node naming families derived by stripping the
trailing number from node short names, MACs, service accounts, bearer tokens, Vault tokens and
eyJ base64 blobs. Addresses are handled by one pattern that matches a dotted quad not embedded in
a longer dotted number, optionally followed by .in-addr.arpa; a reverse name is un-reversed before
the range and node-address check, and only the address itself is replaced, so ports, prefix
lengths, range hyphens and the reverse suffix stay. Each string is first split around its data
URLs: text between them takes the plain rules, and each payload is base64 decoded, gunzipped when
it starts with the gzip magic number, and, if it is UTF-8 text, passed back through the same
routine so nested payloads are handled; a payload that changes is re-encoded, with gzip at a fixed
mtime when it arrived gzipped, and one that does not change or is not text is returned untouched.
Placeholders are salted SHA-256 prefixes keyed on the canonical value, held in a per-response map
with a collision guard, so they are identical across processes and one-to-one within a response.
"""

verification_explanation = """
Every behaviour the verifier asserts is shown at least once in the cleared summaries shipped with
the task or fixed by the service config; what is held out is the data and the combinations. The
verifier generates every graded bundle at grade time: cluster names, node naming families (some
hyphenated), node addresses including one outside every configured range, MACs, accounts,
credentials under varied env-var names, hostnames, resource ids, reasons, namespaces, registries,
digests, versions, errata, public addresses and data-URL payloads are all fresh, and each
sensitive class is planted where no other rule would incidentally catch it. Nothing is replayed
from the samples. The generator records what it planted. Assertions check that the response has
exactly the three lists with exactly the fields of the cleared summaries, in bundle order with
identifying fields unchanged; that no planted sensitive value appears anywhere, including inside
any payload the response carries, which the verifier decodes recursively; and that every planted
non-sensitive value survives, including public, link-local and non-estate private addresses,
path-valued and non-credential env values, and clean gzipped, clean text and binary payloads byte
for byte. Placeholder consistency and injectivity are checked with single-value probe lines
compared whole, so no placeholder syntax is assumed; the same probes check that a hostname in
upper case, and an address with a port, as a range, or as a reverse name with or without its
trailing dot, take the placeholder of the plain value with the surrounding text intact. Payload
probes decode each returned payload and require it to equal the original text with only the
sensitive values replaced by their plain-text placeholders, gzipped exactly when the original
was, including a payload nested in a gzipped one and a clean gzipped payload inside a changed one.
Determinism is checked by repeat, reversed key order, a fresh process with a different hash seed,
and a fresh process receiving the reordered bundle first, each pair more than a second apart so
output that depends on the clock shows up. The service runs under -I -S in a private scratch
directory as an unprivileged account started with only --port.
"""

relevant_experience = """
About 10 years in DevOps, platform and cloud engineering across federal, DoD and
Intelligence Community environments, including running sanitization tooling over
Kubernetes/OpenShift support bundles to release diagnostic data to engineers
outside the security domain, and building air-gapped OpenShift deployment
pipelines with mirrored registries.
"""

